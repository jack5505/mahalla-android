# Жёсткий гейт качества: юнит-тесты + debug-сборка.
# Запускается на каждый PR (в т.ч. PR от claude-dev.yml) — правило проекта:
# тесты обязательны для любого функционала.
name: CI

on:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platforms;android-35 build-tools;35.0.0'

      - name: Android-лицензии (страховка)
        run: |
          for SDKROOT in "$ANDROID_HOME" "$ANDROID_SDK_ROOT"; do
            if [ -x "$SDKROOT/cmdline-tools/latest/bin/sdkmanager" ]; then
              yes | "$SDKROOT/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null 2>&1 || true
            fi
          done

      # v5, не v6: в v6 кэширование вынесено в проприетарный
      # gradle-actions-caching (отдельные Terms of Use Gradle).
      - name: Gradle (кэш)
        uses: gradle/actions/setup-gradle@v5

      - name: Тесты и сборка
        run: ./gradlew testDebugUnitTest assembleDebug
