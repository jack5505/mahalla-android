name: Claude Code

# Интерактивный ассистент: упомяни @claude в комментарии PR/issue, в ревью
# или в теле нового issue — он возьмёт задачу, поправит код, прогонит тесты
# и по просьбе откроет Pull Request.
#
# Крупные задачи «с нуля» удобнее запускать вручную через claude-dev.yml
# (там же поднимается docker-бэкенд + postgres/redis).
#
# Требуется до первого запуска (вручную, разово):
#   1. Установить GitHub App «Claude» на репозиторий
#      (проще всего: в Claude Code выполнить  /install-github-app ).
#   2. Добавить секрет CLAUDE_CODE_OAUTH_TOKEN (или ANTHROPIC_OAUTH_TOKEN —
#      поддержаны оба) в Settings → Secrets and variables → Actions.
#      Значение — из `claude setup-token` (долгоживущий токен вида sk-ant-oat...),
#      НЕ access_token из ~/.claude/.credentials.json: тот живёт часы.
#      Расходуется подписка Pro/Max, отдельной оплаты по токенам нет.
#      Альтернатива: секрет ANTHROPIC_API_KEY
#      (значение — ключ из console.anthropic.com, отдельный биллинг по токенам),
#      тогда в шаге ниже заменить claude_code_oauth_token на anthropic_api_key.

on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]
  pull_request_review:
    types: [submitted]
  issues:
    types: [opened]

jobs:
  claude:
    # Запуск только когда реально упомянут @claude. Проверка привязана к типу
    # события: без этого issue с «@claude» в теле дёргал бы workflow на каждый
    # последующий комментарий (github.event.issue.body есть и в issue_comment).
    # ═══ ЗАЩИТА ДЛЯ ПУБЛИЧНОГО РЕПО ═══
    # Реагируем ТОЛЬКО на упоминания от доверенных аккаунтов из списка ниже.
    # Оркестратор комментирует от аккаунта владельца, поэтому фильтр проходит.
    # Без этой строки любой прохожий в публичном репо мог бы командовать
    # агентом и жечь подписку. Добавили нового человека с write-доступом —
    # дописать его сюда же.
    if: >-
      (github.actor == 'jack5505' || github.actor == 'kuvandikov') && (
        (github.event_name == 'issues' &&
          contains(github.event.issue.body, '@claude')) ||
        (github.event_name == 'pull_request_review' &&
          contains(github.event.review.body, '@claude')) ||
        ((github.event_name == 'issue_comment' ||
          github.event_name == 'pull_request_review_comment') &&
          contains(github.event.comment.body, '@claude'))
      )
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: write        # коммиты, ветки
      pull-requests: write   # создание/комментирование PR
      issues: write          # ответы в issue
      id-token: write
      actions: read          # чтение логов упавшего CI

    env:
      # secrets нельзя читать в `if:` шага, поэтому наличие PAT переносим в env.
      HAS_DESIGN_PAT: ${{ secrets.DESIGN_REPO_PAT != '' }}

    steps:
      # persist-credentials: false обязателен (issue #225). checkout@v6 кладёт
      # GITHUB_TOKEN в отдельный файл и подключает его через
      # `includeIf.gitdir:…path`, а claude-code-action при подмене токена
      # чистит локальный конфиг и файлы из `include.path`, но не `includeIf`
      # (upstream anthropics/claude-code-action#1721, фикс — PR #1722) — в
      # логе прогона «No existing authentication headers to remove».
      # Заголовок с GITHUB_TOKEN оставался в git и перебивал токен приложения
      # из URL remote: пуш агента шёл от github-actions[bot], и `synchronize`
      # в уже открытый PR вставал в action_required с нулём job'ов. Без
      # сохранённого токена git авторизуется только токеном приложения.
      #
      # Держится на том, что репо ПУБЛИЧНЫЙ: action делает fetch ветки PR до
      # подмены токена, и с этой настройкой — анонимно. Станет приватным —
      # @claude упадёт на «could not read Username» (upstream #1236); тогда
      # вернуть сохранение токена, а #225 лечить иначе.
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          persist-credentials: false

      # Дизайн-репо (ТЗ-ANDROID, DESIGN-SYSTEM, SCREENS, прототип) — отдельный
      # репозиторий: токен этого job'а прав на него не даёт, а WebFetch
      # приватный репо не откроет в принципе. Поэтому кладём файлами рядом,
      # Claude читает их через Read/Glob.
      # Нужен секрет DESIGN_REPO_PAT — fine-grained PAT с Contents: read
      # на jack5505/mahalla. Без секрета шаг пропускается.
      - name: Checkout дизайн-репо
        if: env.HAS_DESIGN_PAT == 'true'
        uses: actions/checkout@v6
        with:
          repository: jack5505/mahalla
          path: design-repo
          token: ${{ secrets.DESIGN_REPO_PAT }}
          sparse-checkout: |
            design/android
            rules
            AGENTS.md
            MAHALLA-IMPLEMENTATION.md

      # JDK 17 — проверенная связка с AGP 8.7.3 / Gradle 8.11.1 (см. AGENTS.md).
      # Ставим до запуска Claude, чтобы ./gradlew шёл на нём.
      - name: JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platforms;android-35 build-tools;35.0.0'

      - name: Android-лицензии (страховка)
        run: |
          for SDKROOT in "$ANDROID_HOME" "$ANDROID_SDK_ROOT"; do
            if [ -x "$SDKROOT/cmdline-tools/latest/bin/sdkmanager" ]; then
              yes | "$SDKROOT/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null 2>&1 || true
            fi
          done

      # v5, не v6: в v6 кэширование вынесено в проприетарный
      # gradle-actions-caching (отдельные Terms of Use Gradle).
      - name: Gradle (кэш)
        uses: gradle/actions/setup-gradle@v5

      # 🔧 Опционально: запустить эмулятор для инструментальных тестов
      # (раскомментируйте, если планируете использовать connectedAndroidTest)
      # - name: Run Android Emulator
      #   uses: reactivecircus/android-emulator-runner@v2
      #   with:
      #     api-level: 35
      #     target: google_apis
      #     arch: x86_64
      #     profile: Pixel 6
      #     script: echo "Emulator is ready"

      - name: Claude Code
        id: claude
        uses: anthropics/claude-code-action@v1
        env:
          # Без GH_TOKEN у Claude не работает `gh`: ни создать issue/PR, ни
          # прочитать логи прогона. Права — из permissions этого job'а.
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          # Stop-хук: не даёт закончить ход на красной сборке.
          #
          # Настройки заданы ИНЛАЙНОМ, а не путём к файлу, и это принципиально.
          # Действие сначала пробует JSON.parse входа и только при неудаче
          # читает его как путь. Путь тут не работает: `actions/checkout`
          # выкачивает ветку по умолчанию, а сам action затем переключается на
          # ветку PR — файл из .github/ на старой ветке исчезает, и прогон
          # падает с `ENOENT` ещё до старта Claude (прогоны 34017224699,
          # 34017716238). Инлайновый JSON файловой системы не касается.
          #
          # Скрипт живёт в .claude/hooks/, потому что .claude входит в
          # SENSITIVE_PATHS действия (src/github/operations/restore-config.ts)
          # и восстанавливается из базовой ветки поверх ветки PR — значит есть
          # и на ветках старше хука. .github/ туда не входит.
          # Проверка -x в команде на случай, когда восстановления не было.
          settings: |
            {
              "hooks": {
                "Stop": [
                  {
                    "hooks": [
                      {
                        "type": "command",
                        "command": "bash -c 'f=\"$CLAUDE_PROJECT_DIR/.claude/hooks/verify-turn.sh\"; [ -x \"$f\" ] || exit 0; exec \"$f\"'",
                        "timeout": 1800,
                        "statusMessage": "Проверяю: тесты и сборка"
                      }
                    ]
                  }
                ]
              }
            }
          # OAuth-токен подписки Pro/Max вместо API-ключа.
          # Поддержаны оба имени секрета: сначала каноническое
          # CLAUDE_CODE_OAUTH_TOKEN, иначе исторический ANTHROPIC_OAUTH_TOKEN.
          # Незаданный секрет даёт пустую строку, поэтому || работает.
          #
          # Поменяли эту строку (или имя секрета в ней) — проверять НОВЫМ
          # комментарием @claude, а не кнопкой Re-run: перезапуск берёт workflow
          # той версии, что была при исходном событии. 2026-09-10 откат токена в
          # main «не помог» именно поэтому — прогон 34490398082 перезапускали на
          # старой версии файла. Новое ЗНАЧЕНИЕ того же секрета Re-run подхватит:
          # секреты читаются при запуске.
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN || secrets.ANTHROPIC_OAUTH_TOKEN }}
          # prompt не задаём: action сам берёт контекст комментария/issue/ревью.
          branch_prefix: 'claude/'
          use_sticky_comment: 'true'
          # Модель по умолчанию — Sonnet: Opus выедает лимит подписки
          # заметно быстрее, а рутинной задаче по issue его запас не нужен.
          # Для тяжёлой задачи — переменная CLAUDE_MODEL (Settings → Secrets
          # and variables → Actions → Variables, например claude-opus-5),
          # файл не трогать.
          #
          # Модель фиксируем явно: валидный id для API, без тега [1m] —
          # с claude-opus-5[1m] прогон падал сразу (is_error, $0).
          #
          # --allowed-tools ОБЯЗАТЕЛЕН. Без него в CI у Claude нет ни Bash
          # (значит ни `gh`, ни `./gradlew`), ни WebFetch — он сообщает
          # «инструменты запрещены» и работает вслепую. Новый инструмент
          # понадобился — дописывать сюда. Опасные операции по-прежнему
          # режет deny-лист в .claude/settings.json (force-push, sudo, rm -rf).
          claude_args: |
            --model ${{ vars.CLAUDE_MODEL || 'claude-sonnet-5' }}
            --allowed-tools Bash,Read,Write,Edit,Glob,Grep,WebFetch,WebSearch,Task,Agent,TodoWrite

      # Причина падения Claude. Action прячет весь вывод (show_full_output:
      # false — и правильно: репо публичный, а там промпт и вывод
      # инструментов), поэтому упавший прогон выглядит как «Claude encountered
      # an error after 0s» без единого слова о причине (прогоны 34476815400,
      # 34490181983, 34490398082). Сама причина при этом лежит в файле
      # выполнения: тип ошибки у сообщения assistant и текст в итоговом
      # сообщении. Печатаем только их — ни промпта, ни вывода инструментов — и
      # дублируем первой строкой в аннотацию, чтобы она была видна в сводке
      # прогона без раскрытия лога. Типичное: authentication_failed (секрет
      # токена неверный или протух), rate_limit (кончился лимит подписки).
      #
      # Текст итогового сообщения печатается ТОЛЬКО при is_error: шаг
      # срабатывает на любом падении action, и если Claude отработал, а упал
      # другой внутренний шаг, в .result лежит его финальный ответ — туда может
      # быть процитирован вывод инструментов. Сам текст пришёл извне, поэтому
      # печатается под ::stop-commands:: — строка вида «::add-mask::» внутри
      # него не выполнится как команда раннера.
      #
      # Скрипт инлайном, а не файлом: action переключается на ветку PR, и файла
      # из .github/ на старой ветке может не быть (см. комментарий к settings).
      - name: Причина ошибки Claude
        if: failure() && steps.claude.outcome == 'failure'
        shell: bash
        env:
          EXECUTION_FILE: ${{ steps.claude.outputs.execution_file }}
        run: |
          f="${EXECUTION_FILE:-$RUNNER_TEMP/claude-execution-output.json}"
          if [ ! -s "$f" ]; then
            echo "::error title=Claude::Файла выполнения нет — Claude упал до запуска (см. шаги выше)."
            exit 0
          fi
          if ! jq -e 'type == "array"' "$f" >/dev/null 2>&1; then
            echo "::error title=Claude::Файл выполнения не разобрался как JSON-массив."
            exit 0
          fi
          last='[.[] | select(.type == "result")] | last'
          kind=$(jq -r '[.[] | select(.type == "assistant") | .error // empty] | unique | join(" ")' "$f")
          summary=$(jq -r "$last"' | if . == null then "итогового сообщения нет"
            else "is_error=\(.is_error) subtype=\(.subtype) http=\(.api_error_status // "-") ходов=\(.num_turns) стоимость=$\(.total_cost_usd)" end' "$f")
          # Обрезка — в jq и в bash, не через `| head`: шаг идёт с pipefail
          # (shell: bash), и head, закрыв трубу, убил бы jq по SIGPIPE.
          text=$(jq -r "$last"' | if .is_error == true then (.result // "") | tostring | .[0:1500] else "" end' "$f")
          errors=$(jq -r "$last"' | (.errors // []) | join("; ") | .[0:500]' "$f")
          token=$(openssl rand -hex 16)
          echo "::stop-commands::$token"
          echo "Итог:       $summary"
          echo "Тип ошибки: ${kind:-не указан}"
          if [ -n "$errors" ]; then echo "Ошибки:     $errors"; fi
          echo "Текст:"
          printf '%s\n' "${text:-(пусто или не ошибка)}"
          echo "::$token::"
          first=${text:-$errors}
          first=${first%%$'\n'*}
          first=${first//$'\r'/}
          first=${first:0:300}
          first=${first//%/%25}
          first=${first//::/: :}
          title="Claude: ${kind:-ошибка}"
          title=${title//,/%2C}
          title=${title//:/%3A}
          echo "::error title=$title::${first:-без текста, см. лог шага}"
