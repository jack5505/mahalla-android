name: Claude Code

# Интерактивный ассистент: упомяни @claude в комментарии PR/issue, в ревью
# или в теле нового issue — он возьмёт задачу, поправит код, прогонит тесты
# и по просьбе откроет Pull Request.
#
# Крупные задачи «с нуля» удобнее запускать вручную через claude-dev.yml
# (там же поднимается docker-бэкенд + postgres/redis).
#
# Требуется до первого запуска (вручную, разово):
#   1. Установить GitHub App «Claude» на репозиторий
#      (проще всего: в Claude Code выполнить  /install-github-app ).
#   2. Добавить секрет CLAUDE_CODE_OAUTH_TOKEN (или ANTHROPIC_OAUTH_TOKEN —
#      поддержаны оба) в Settings → Secrets and variables → Actions.
#      Значение — из `claude setup-token` (долгоживущий токен вида sk-ant-oat...),
#      НЕ access_token из ~/.claude/.credentials.json: тот живёт часы.
#      Расходуется подписка Pro/Max, отдельной оплаты по токенам нет.
#      Альтернатива: секрет ANTHROPIC_API_KEY
#      (значение — ключ из console.anthropic.com, отдельный биллинг по токенам),
#      тогда в шаге ниже заменить claude_code_oauth_token на anthropic_api_key.

on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]
  pull_request_review:
    types: [submitted]
  issues:
    types: [opened]

jobs:
  claude:
    # Запуск только когда реально упомянут @claude. Проверка привязана к типу
    # события: без этого issue с «@claude» в теле дёргал бы workflow на каждый
    # последующий комментарий (github.event.issue.body есть и в issue_comment).
    # ═══ ЗАЩИТА ДЛЯ ПУБЛИЧНОГО РЕПО ═══
    # Реагируем ТОЛЬКО на упоминания от владельца (github.actor == 'jack5505').
    # Оркестратор комментирует от этого же аккаунта, поэтому фильтр проходит.
    # Без этой строки любой прохожий в публичном репо мог бы командовать
    # агентом и жечь подписку.
    if: >-
      github.actor == 'jack5505' && (
        (github.event_name == 'issues' &&
          contains(github.event.issue.body, '@claude')) ||
        (github.event_name == 'pull_request_review' &&
          contains(github.event.review.body, '@claude')) ||
        ((github.event_name == 'issue_comment' ||
          github.event_name == 'pull_request_review_comment') &&
          contains(github.event.comment.body, '@claude'))
      )
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: write        # коммиты, ветки
      pull-requests: write   # создание/комментирование PR
      issues: write          # ответы в issue
      id-token: write
      actions: read          # чтение логов упавшего CI

    env:
      # secrets нельзя читать в `if:` шага, поэтому наличие PAT переносим в env.
      HAS_DESIGN_PAT: ${{ secrets.DESIGN_REPO_PAT != '' }}

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      # Дизайн-репо (ТЗ-ANDROID, DESIGN-SYSTEM, SCREENS, прототип) — отдельный
      # репозиторий: токен этого job'а прав на него не даёт, а WebFetch
      # приватный репо не откроет в принципе. Поэтому кладём файлами рядом,
      # Claude читает их через Read/Glob.
      # Нужен секрет DESIGN_REPO_PAT — fine-grained PAT с Contents: read
      # на jack5505/mahalla. Без секрета шаг пропускается.
      - name: Checkout дизайн-репо
        if: env.HAS_DESIGN_PAT == 'true'
        uses: actions/checkout@v6
        with:
          repository: jack5505/mahalla
          path: design-repo
          token: ${{ secrets.DESIGN_REPO_PAT }}
          sparse-checkout: |
            design/android
            rules
            AGENTS.md
            MAHALLA-IMPLEMENTATION.md

      # JDK 17 — проверенная связка с AGP 8.7.3 / Gradle 8.11.1 (см. AGENTS.md).
      # Ставим до запуска Claude, чтобы ./gradlew шёл на нём.
      - name: JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platforms;android-35 build-tools;35.0.0'

      - name: Android-лицензии (страховка)
        run: |
          for SDKROOT in "$ANDROID_HOME" "$ANDROID_SDK_ROOT"; do
            if [ -x "$SDKROOT/cmdline-tools/latest/bin/sdkmanager" ]; then
              yes | "$SDKROOT/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null 2>&1 || true
            fi
          done

      # v5, не v6: в v6 кэширование вынесено в проприетарный
      # gradle-actions-caching (отдельные Terms of Use Gradle).
      - name: Gradle (кэш)
        uses: gradle/actions/setup-gradle@v5

      # 🔧 Опционально: запустить эмулятор для инструментальных тестов
      # (раскомментируйте, если планируете использовать connectedAndroidTest)
      # - name: Run Android Emulator
      #   uses: reactivecircus/android-emulator-runner@v2
      #   with:
      #     api-level: 35
      #     target: google_apis
      #     arch: x86_64
      #     profile: Pixel 6
      #     script: echo "Emulator is ready"

      - name: Claude Code
        uses: anthropics/claude-code-action@v1
        env:
          # Без GH_TOKEN у Claude не работает `gh`: ни создать issue/PR, ни
          # прочитать логи прогона. Права — из permissions этого job'а.
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          # OAuth-токен подписки Pro/Max вместо API-ключа.
          # Поддержаны оба имени секрета: сначала каноническое
          # CLAUDE_CODE_OAUTH_TOKEN, иначе исторический ANTHROPIC_OAUTH_TOKEN.
          # Незаданный секрет даёт пустую строку, поэтому || работает.
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN || secrets.ANTHROPIC_OAUTH_TOKEN }}
          # prompt не задаём: action сам берёт контекст комментария/issue/ревью.
          branch_prefix: 'claude/'
          use_sticky_comment: 'true'
          # Модель фиксируем явно: валидный id для API, без тега [1m] —
          # с claude-opus-5[1m] прогон падал сразу (is_error, $0).
          #
          # --allowed-tools ОБЯЗАТЕЛЕН. Без него в CI у Claude нет ни Bash
          # (значит ни `gh`, ни `./gradlew`), ни WebFetch — он сообщает
          # «инструменты запрещены» и работает вслепую. Новый инструмент
          # понадобился — дописывать сюда. Опасные операции по-прежнему
          # режет deny-лист в .claude/settings.json (force-push, sudo, rm -rf).
          claude_args: |
            --model claude-opus-5
            --allowedTools "Bash(./gradlew:*)"
