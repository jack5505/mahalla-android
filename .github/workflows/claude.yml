name: Claude Code

# Интерактивный ассистент: упомяни @claude в комментарии PR/issue, в ревью
# или в теле нового issue — он возьмёт задачу, поправит код, прогонит тесты
# и по просьбе откроет Pull Request.
#
# Крупные задачи «с нуля» удобнее запускать вручную через claude-dev.yml
# (там же поднимается docker-бэкенд + postgres/redis).
#
# Требуется до первого запуска (вручную, разово):
#   1. Установить GitHub App «Claude» на репозиторий
#      (проще всего: в Claude Code выполнить  /install-github-app ).
#   2. Добавить секрет CLAUDE_CODE_OAUTH_TOKEN в Settings → Secrets and variables
#      → Actions (значение — из `claude setup-token`; расходуется подписка
#      Pro/Max, отдельной оплаты нет).
#      Альтернатива: секрет ANTHROPIC_API_KEY
#      (значение — ключ из console.anthropic.com, отдельный биллинг по токенам),
#      тогда в шаге ниже заменить claude_code_oauth_token на anthropic_api_key.

on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]
  pull_request_review:
    types: [submitted]
  issues:
    types: [opened]

jobs:
  claude:
    # Запуск только когда реально упомянут @claude. Проверка привязана к типу
    # события: без этого issue с «@claude» в теле дёргал бы workflow на каждый
    # последующий комментарий (github.event.issue.body есть и в issue_comment).
    if: >-
      (github.event_name == 'issues' &&
        contains(github.event.issue.body, '@claude')) ||
      (github.event_name == 'pull_request_review' &&
        contains(github.event.review.body, '@claude')) ||
      ((github.event_name == 'issue_comment' ||
        github.event_name == 'pull_request_review_comment') &&
        contains(github.event.comment.body, '@claude'))
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: write        # коммиты, ветки
      pull-requests: write   # создание/комментирование PR
      issues: write          # ответы в issue
      id-token: write
      actions: read          # чтение логов упавшего CI
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      # JDK 17 — проверенная связка с AGP 8.7.3 / Gradle 8.11.1 (см. AGENTS.md).
      # Ставим до запуска Claude, чтобы ./gradlew шёл на нём.
      - name: JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platforms;android-35 build-tools;35.0.0'

      - name: Android-лицензии (страховка)
        run: |
          for SDKROOT in "$ANDROID_HOME" "$ANDROID_SDK_ROOT"; do
            if [ -x "$SDKROOT/cmdline-tools/latest/bin/sdkmanager" ]; then
              yes | "$SDKROOT/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null 2>&1 || true
            fi
          done

      # v5, не v6: в v6 кэширование вынесено в проприетарный
      # gradle-actions-caching (отдельные Terms of Use Gradle).
      - name: Gradle (кэш)
        uses: gradle/actions/setup-gradle@v5

      - name: Claude Code
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          # Явно фиксируем модель Opus 5 (валидный id для API, без тега [1m]).
          # Прошлый прогон падал сразу (is_error, $0), т.к. использовался
          # claude-opus-5[1m] — тег [1m] невалиден для API.
          claude_args: "--model claude-opus-5"
