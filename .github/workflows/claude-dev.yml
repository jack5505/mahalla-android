# Разработка через Claude Code внутри GitHub Actions (официальный action).
#
# Запуск: Actions → "Claude Code Dev" → Run workflow (ввод: задача).
# Реакция на «@claude» в комментариях — в отдельном workflow claude.yml,
# чтобы на одно упоминание не отвечали два прогона.
#
# Коммиты, ветку и PR создаёт сам action (от имени claude[bot]) — отдельного
# шага с git push больше нет.
#
# Требуется до первого запуска (вручную, разово):
#   1. Установить GitHub App «Claude» на репозиторий
#      (проще всего: локально в Claude Code выполнить  /install-github-app ).
#   2. Секрет CLAUDE_CODE_OAUTH_TOKEN — или ANTHROPIC_OAUTH_TOKEN, поддержаны
#      оба (Settings → Secrets and variables → Actions). Значение — из
#      `claude setup-token` (долгоживущий токен вида sk-ant-oat...), НЕ
#      access_token из ~/.claude/.credentials.json: тот живёт часы.
#      Расходуется подписка Pro/Max, отдельной оплаты по токенам нет.
#      Альтернатива — секрет ANTHROPIC_API_KEY (ключ из console.anthropic.com,
#      отдельный биллинг): тогда ниже заменить claude_code_oauth_token на
#      anthropic_api_key.
#   3. Переменные репо (необязательные, с дефолтами):
#        BACKEND_IMAGE       — docker-образ бэкенда (без него шаг пропускается)
#        BACKEND_PORT        — порт бэкенда (по умолчанию 8080)
#        BACKEND_HEALTH_PATH — health-endpoint (по умолчанию /actuator/health)

name: Claude Code Dev

on:
  workflow_dispatch:
    inputs:
      task:
        description: 'Задача для Claude Code (что разработать)'
        required: true
        type: string
      base_branch:
        description: 'Ветка-основа для PR'
        required: false
        default: 'main'
        type: string
      model:
        description: 'Модель Claude'
        required: false
        default: 'claude-opus-5'
        type: choice
        options:
          - claude-opus-5
          - claude-sonnet-5
          - claude-haiku-4-5
      max_turns:
        description: 'Максимум ходов Claude Code (защита от зацикливания)'
        required: false
        default: '80'
        type: string
      backend_image:
        description: 'Переопределить docker-образ бэкенда (пусто = переменная BACKEND_IMAGE)'
        required: false
        default: ''
        type: string

jobs:
  claude-dev:
    runs-on: ubuntu-latest
    timeout-minutes: 180

    permissions:
      contents: write        # коммиты, ветки
      pull-requests: write   # создание/комментирование PR
      issues: write          # ответы в issue
      id-token: write
      actions: read          # чтение логов упавшего CI

    # Зависимости бэкенда. Состав уточнить по mahalla-репо
    # (MAHALLA-IMPLEMENTATION.md): возможно, нужен ещё kafka и т.п.
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: mahalla
          POSTGRES_PASSWORD: mahalla
          POSTGRES_DB: mahalla
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U mahalla"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      # JDK 17 — проверенная связка с AGP 8.7.3 / Gradle 8.11.1 (см. AGENTS.md).
      # Ставим до Claude, чтобы ./gradlew шёл на нём.
      - name: JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platforms;android-35 build-tools;35.0.0'

      - name: Android-лицензии (страховка)
        run: |
          for SDKROOT in "$ANDROID_HOME" "$ANDROID_SDK_ROOT"; do
            if [ -x "$SDKROOT/cmdline-tools/latest/bin/sdkmanager" ]; then
              yes | "$SDKROOT/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null 2>&1 || true
            fi
          done

      # v5, не v6: в v6 кэширование вынесено в проприетарный
      # gradle-actions-caching (отдельные Terms of Use Gradle).
      - name: Gradle (кэш)
        uses: gradle/actions/setup-gradle@v5

      - name: Поднять бэкенд (docker-образ)
        env:
          BACKEND_IMAGE: ${{ inputs.backend_image || vars.BACKEND_IMAGE }}
          BACKEND_PORT: ${{ vars.BACKEND_PORT || '8080' }}
          BACKEND_HEALTH_PATH: ${{ vars.BACKEND_HEALTH_PATH || '/actuator/health' }}
        run: |
          if [ -z "$BACKEND_IMAGE" ]; then
            echo "::warning::BACKEND_IMAGE не задан — бэкенд пропущен. Задай переменную репо BACKEND_IMAGE или input backend_image."
            exit 0
          fi
          docker pull "$BACKEND_IMAGE"
          docker run -d --name backend -p "${BACKEND_PORT}:${BACKEND_PORT}" "$BACKEND_IMAGE"
          for i in $(seq 1 60); do
            if curl -sf -o /dev/null "http://localhost:${BACKEND_PORT}${BACKEND_HEALTH_PATH}"; then
              echo "::notice::Бэкенд готов: http://localhost:${BACKEND_PORT}"
              exit 0
            fi
            sleep 2
          done
          echo "::warning::Бэкенд не ответил за 120 c — продолжаю без него (диагностика: docker logs backend)"

      - name: Claude Code
        uses: anthropics/claude-code-action@v1
        env:
          BACKEND_PORT: ${{ vars.BACKEND_PORT || '8080' }}
          BACKEND_HEALTH_PATH: ${{ vars.BACKEND_HEALTH_PATH || '/actuator/health' }}
        with:
          # OAuth-токен подписки Pro/Max вместо API-ключа.
          # Поддержаны оба имени секрета: сначала каноническое
          # CLAUDE_CODE_OAUTH_TOKEN, иначе исторический ANTHROPIC_OAUTH_TOKEN.
          # Незаданный секрет даёт пустую строку, поэтому || работает.
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN || secrets.ANTHROPIC_OAUTH_TOKEN }}
          prompt: ${{ inputs.task }}
          base_branch: ${{ inputs.base_branch }}
          branch_prefix: 'claude-dev/'
          # Модель фиксируем явно: валидный id для API, без тега [1m] —
          # с claude-opus-5[1m] прогон падал сразу (is_error, $0).
          claude_args: |
            --model ${{ inputs.model }}
            --max-turns ${{ inputs.max_turns }}
            --allowedTools Bash,Read,Write,Edit,Glob,Grep,WebFetch
