# Сборка debug-APK и публикация GitHub Release для внутреннего тестирования.
#
# Раздача — через GitHub Releases (без Play Console / Firebase): тестер
# заходит по ссылке на релиз и ставит APK вручную. Сборка — debug (подписана
# отладочным ключом, устанавливается без доп. настройки подписи); это не
# продакшн-релиз в Play, а именно internal-test сборка.
#
# Запуск:
#   - вручную: Actions → "Release (internal test)" → Run workflow;
#   - по тегу вида v1.2.3 (git tag v1.2.3 && git push origin v1.2.3).
# Правило проекта «тесты обязательны» — тесты гоняются перед сборкой,
# красные тесты релиз останавливают.
#
# Подпись: секрет `DEBUG_KEYSTORE_BASE64` (base64 от debug.keystore со
# стандартными alias/паролями `androiddebugkey`/`android`). Без него раннер
# каждый раз генерирует новый ключ, и следующий релиз не ставится поверх
# предыдущего («пакет недействителен»). Ключ читает app/build.gradle.kts
# через `DEBUG_KEYSTORE_FILE`.
name: Release (internal test)

on:
  workflow_dispatch:
    inputs:
      notes:
        description: 'Заметка к релизу (что тестируем)'
        required: false
        default: ''
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platforms;android-35 build-tools;35.0.0'

      - name: Android-лицензии (страховка)
        run: |
          for SDKROOT in "$ANDROID_HOME" "$ANDROID_SDK_ROOT"; do
            if [ -x "$SDKROOT/cmdline-tools/latest/bin/sdkmanager" ]; then
              yes | "$SDKROOT/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null 2>&1 || true
            fi
          done

      - name: Gradle (кэш)
        uses: gradle/actions/setup-gradle@v5

      - name: Тесты
        run: ./gradlew testDebugUnitTest

      - name: Постоянный debug-ключ
        id: keystore
        env:
          DEBUG_KEYSTORE_BASE64: ${{ secrets.DEBUG_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$DEBUG_KEYSTORE_BASE64" ]; then
            echo "::warning::Секрет DEBUG_KEYSTORE_BASE64 не задан: APK подписан случайным ключом раннера и не встанет поверх предыдущего релиза"
            echo "note=⚠️ Подписано случайным ключом: перед установкой удалите предыдущую сборку." >> "$GITHUB_OUTPUT"
            exit 0
          fi
          printf '%s' "$DEBUG_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/debug.keystore"
          # Неверный секрет лучше поймать здесь, а не туманной ошибкой из assembleDebug.
          keytool -list -keystore "$RUNNER_TEMP/debug.keystore" -storepass android -alias androiddebugkey > /dev/null
          echo "DEBUG_KEYSTORE_FILE=$RUNNER_TEMP/debug.keystore" >> "$GITHUB_ENV"
          echo "note=" >> "$GITHUB_OUTPUT"

      - name: Версия и имя релиза
        id: meta
        run: |
          VERSION_NAME=$(grep -m1 'versionName = ' app/build.gradle.kts | sed -E 's/.*"([^"]+)".*/\1/')
          SHORT_SHA=$(git rev-parse --short HEAD)
          if [[ "${GITHUB_REF}" == refs/tags/* ]]; then
            TAG="${GITHUB_REF#refs/tags/}"
          else
            TAG="internal-${VERSION_NAME}-${SHORT_SHA}-${GITHUB_RUN_NUMBER}"
          fi
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
          echo "apk_name=mahalla-${VERSION_NAME}-${SHORT_SHA}-debug.apk" >> "$GITHUB_OUTPUT"

      - name: Сборка debug-APK
        run: ./gradlew assembleDebug
        env:
          MAPKIT_API_KEY: ${{ secrets.MAPKIT_API_KEY }}

      - name: Переименовать APK
        run: cp app/build/outputs/apk/debug/app-debug.apk "${{ steps.meta.outputs.apk_name }}"

      - name: GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.meta.outputs.tag }}
          name: "Internal test ${{ steps.meta.outputs.tag }}"
          body: |
            Debug-сборка для внутреннего тестирования (не для Play).
            Коммит: ${{ github.sha }}
            ${{ steps.keystore.outputs.note }}

            ${{ inputs.notes }}
          prerelease: true
          files: ${{ steps.meta.outputs.apk_name }}
