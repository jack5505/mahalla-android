# Сборка debug-APK и публикация GitHub Release для внутреннего тестирования.
#
# Раздача — через GitHub Releases (без Play Console / Firebase): тестер
# заходит по ссылке на релиз и ставит APK вручную. Сборка — debug (подписана
# отладочным ключом, устанавливается без доп. настройки подписи); это не
# продакшн-релиз в Play, а именно internal-test сборка.
#
# Запуск:
#   - вручную: Actions → "Release (internal test)" → Run workflow;
#   - по тегу вида v1.2.3 (git tag v1.2.3 && git push origin v1.2.3).
# Правило проекта «тесты обязательны» — тесты гоняются перед сборкой,
# красные тесты релиз останавливают.
name: Release (internal test)

on:
  workflow_dispatch:
    inputs:
      notes:
        description: 'Заметка к релизу (что тестируем)'
        required: false
        default: ''
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platforms;android-35 build-tools;35.0.0'

      - name: Android-лицензии (страховка)
        run: |
          for SDKROOT in "$ANDROID_HOME" "$ANDROID_SDK_ROOT"; do
            if [ -x "$SDKROOT/cmdline-tools/latest/bin/sdkmanager" ]; then
              yes | "$SDKROOT/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null 2>&1 || true
            fi
          done

      - name: Gradle (кэш)
        uses: gradle/actions/setup-gradle@v5

      - name: Тесты
        run: ./gradlew testDebugUnitTest

      - name: Сборка debug-APK
        run: ./gradlew assembleDebug

      - name: Версия и имя релиза
        id: meta
        run: |
          VERSION_NAME=$(grep -m1 'versionName = ' app/build.gradle.kts | sed -E 's/.*"([^"]+)".*/\1/')
          SHORT_SHA=$(git rev-parse --short HEAD)
          if [[ "${GITHUB_REF}" == refs/tags/* ]]; then
            TAG="${GITHUB_REF#refs/tags/}"
          else
            TAG="internal-${VERSION_NAME}-${SHORT_SHA}-${GITHUB_RUN_NUMBER}"
          fi
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
          echo "apk_name=mahalla-${VERSION_NAME}-${SHORT_SHA}-debug.apk" >> "$GITHUB_OUTPUT"

      - name: Переименовать APK
        run: cp app/build/outputs/apk/debug/app-debug.apk "${{ steps.meta.outputs.apk_name }}"

      - name: GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.meta.outputs.tag }}
          name: "Internal test ${{ steps.meta.outputs.tag }}"
          body: |
            Debug-сборка для внутреннего тестирования (не для Play).
            Коммит: ${{ github.sha }}

            ${{ inputs.notes }}
          prerelease: true
          files: ${{ steps.meta.outputs.apk_name }}
