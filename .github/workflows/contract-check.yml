# Сверка контракта с живым стендом.
#
# Дёргает ручки вертикали скриптом из contract/, складывает ответы в фикстуры
# (app/src/test/resources/contract/), прогоняет по ним контрактный тест и
# отдаёт результат Claude — тот разбирает расхождения, правит DTO и статусы
# ⚠️/✅ в docs/API-CONTRACT.md и открывает PR.
#
# Расписания нарочно нет: стенд поднимается не всегда, а ночные красные
# прогоны быстро перестают читать. Запуск руками, когда стенд жив.
#
# Переменные и секреты (Settings → Secrets and variables → Actions):
#   CONTRACT_BASE_URL          (var, необязательно) адрес стенда с /api/v1
#   CONTRACT_BOOKING_PLACE_ID  (var, необязательно) uuid заведения с услугами
#   CONTRACT_REFRESH_TOKEN     (secret) refresh-токен живого аккаунта.
#     Без него анонимные пробы (услуги, слоты) идут, а всё под токеном —
#     включая главную, POST appointments — пропускается.

name: Contract Check

on:
  workflow_dispatch:
    inputs:
      vertical:
        description: 'Вертикаль для сверки'
        required: true
        default: 'booking'
        type: choice
        options:
          - booking
      ask_claude:
        description: 'Отдать результат Claude (разобрать, починить, открыть PR)'
        required: false
        default: true
        type: boolean

jobs:
  contract:
    runs-on: ubuntu-latest
    timeout-minutes: 90

    permissions:
      contents: write
      pull-requests: write
      issues: write
      id-token: write
      actions: read

    steps:
      # persist-credentials: false — чтобы пуш агента шёл от claude[bot], а не
      # от GITHUB_TOKEN; подробности в claude.yml у того же шага (issue #225).
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          persist-credentials: false

      # Пробы не должны валить job: упавшая проба — это и есть находка, ради
      # которой всё запускалось. Её разберёт шаг с Claude ниже.
      - name: Пробы по стенду
        id: probes
        continue-on-error: true
        env:
          CONTRACT_BASE_URL: ${{ vars.CONTRACT_BASE_URL }}
          CONTRACT_BOOKING_PLACE_ID: ${{ vars.CONTRACT_BOOKING_PLACE_ID }}
          CONTRACT_REFRESH_TOKEN: ${{ secrets.CONTRACT_REFRESH_TOKEN }}
        run: |
          set -o pipefail
          chmod +x "contract/${{ inputs.vertical }}.sh"
          "contract/${{ inputs.vertical }}.sh" 2>&1 | tee /tmp/probes.log

      - name: Снятые ответы
        uses: actions/upload-artifact@v4
        with:
          name: contract-samples-${{ inputs.vertical }}
          path: app/src/test/resources/contract/
          if-no-files-found: warn

      - name: JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Gradle (кэш)
        uses: gradle/actions/setup-gradle@v5

      - name: Контрактный тест по снятым ответам
        id: contract-test
        continue-on-error: true
        run: |
          set -o pipefail
          # *Contract*Test, а не *ContractTest: под фильтр должны попадать и
          # тесты самого инструмента (ContractSampleTest).
          ./gradlew testDebugUnitTest --tests '*Contract*Test' 2>&1 | tee /tmp/contract-test.log

      - name: Claude — разобрать расхождения
        if: inputs.ask_claude
        uses: anthropics/claude-code-action@v1
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN || secrets.ANTHROPIC_OAUTH_TOKEN }}
          branch_prefix: 'contract/'
          prompt: |
            Сверка контракта вертикали «${{ inputs.vertical }}» с живым стендом.

            Пробы уже прогнаны скриптом contract/${{ inputs.vertical }}.sh,
            их вывод — в /tmp/probes.log, вывод контрактного теста —
            в /tmp/contract-test.log. Снятые ответы стенда лежат в
            app/src/test/resources/contract/${{ inputs.vertical }}/.

            Прочитай оба лога и сами ответы, затем:

            1. Разберись, где клиент расходится со стендом: коды ответов не
               те, поля DTO не совпали, тело запроса не принято. Пробы под
               токеном могли быть пропущены — если CONTRACT_REFRESH_TOKEN не
               задан, так и напиши, это не ошибка кода.
            2. Почини расхождения в коде вертикали, если они очевидны и
               подтверждены ответом стенда. НЕ угадывай: не подтверждено
               ответом — пиши в отчёт, а не правь наугад
               (.claude/rules/network.md).
            3. Обнови docs/API-CONTRACT.md: подтверждённые ручки переводи
               с ⚠️ на ✅ со ссылкой на этот прогон, расхождения описывай там же.
            4. Закоммить снятые фикстуры вместе с правками — по ним тест
               работает без стенда.
            5. Прогони ./gradlew testDebugUnitTest и assembleDebug, открой PR.

            В отчёте: какие ручки подтверждены, какие разошлись и чем, что
            осталось непроверенным и почему.
          claude_args: |
            --model claude-opus-5
            --allowed-tools Bash,Read,Write,Edit,Glob,Grep,Task,Agent,TodoWrite

      # Оба шага выше стоят под continue-on-error, чтобы Claude успел разобрать
      # неудачу. Без этого шага прогон был бы зелёным всегда — и «сверка прошла»
      # означало бы только «workflow дошёл до конца».
      - name: Итог
        if: always()
        run: |
          fail=0
          [ "${{ steps.probes.outcome }}" = "success" ] || { echo "::error::пробы по стенду упали"; fail=1; }
          [ "${{ steps.contract-test.outcome }}" = "success" ] || { echo "::error::контрактный тест упал"; fail=1; }
          exit $fail
